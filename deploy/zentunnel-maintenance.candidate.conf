server {
    server_name zentunnel.net;

    root /var/www/vpn-crm;
    index index.html;

    client_max_body_size 20m;

    location /.well-known/acme-challenge/ {
        root /var/www/vpn-crm;
        try_files $uri =404;
    }

    # HyperLine review: temporary WEB/ADMIN maintenance only.
    # Keep /api/v1 VPN device/auth/provisioning and /sanctum routes intact.
    location / {
        add_header Retry-After 600 always;
        return 503;
    }
    location = /api/admin/v1 {
        add_header Retry-After 600 always;
        return 503;
    }
    location ^~ /api/admin/v1/ {
        add_header Retry-After 600 always;
        return 503;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
    }

    location /sanctum/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/zentunnel.net/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/zentunnel.net/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = zentunnel.net) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name zentunnel.net;
    return 404; # managed by Certbot


}