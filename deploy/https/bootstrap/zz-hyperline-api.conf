# STAGING ONLY: new file zz-hyperline-api.conf, sorted AFTER existing zentunnel.
# Do not install until explicit approval. Never use default_server.
server {
    listen 80;
    listen [::]:80;
    server_name api.zentunnel.net;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/hyperline-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        add_header Retry-After 300 always;
        return 503;
    }
}
