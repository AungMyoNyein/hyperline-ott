# Included inside a location{}. No URI suffix: preserve the ENTIRE request URI.
proxy_pass http://127.0.0.1:18080;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Port 443;
# This host is the verified public edge. Discard client-supplied forwarding chains.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
proxy_connect_timeout 5s;
proxy_send_timeout 60s;
proxy_request_buffering on;
# No proxy_cache or media proxy: HLS loads directly from the existing CDN.
