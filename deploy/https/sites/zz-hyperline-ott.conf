# STAGING ONLY: new file zz-hyperline-ott.conf, sorted AFTER existing zentunnel.
# Do not install until explicit approval. Never use default_server.
server {
    listen 80;
    listen [::]:80;
    server_name ott.zentunnel.net;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/hyperline-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://ott.zentunnel.net$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ott.zentunnel.net;
    # One separate SAN lineage for the three HyperLine names ONLY.
    ssl_certificate /etc/letsencrypt/live/hyperline-ott/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hyperline-ott/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    # JSON metadata only; match the current gateway's 1m default. No video upload.
    client_max_body_size 1m;
    client_body_timeout 30s;
    access_log /var/log/nginx/hyperline-ott.access.log hyperline_app_safe;
    error_log /var/log/nginx/hyperline-ott.error.log warn;
    location / {
        include /etc/nginx/snippets/hyperline-edge-proxy.conf;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $hyperline_app_connection_upgrade;
        proxy_read_timeout 300s;
        # Permit incremental Next.js responses. Upgrade requires gateway support too.
        proxy_buffering off;
    }
}
