# STAGING ONLY. New http{} include; never replace existing global directives.
map $http_upgrade $hyperline_app_connection_upgrade {
    default upgrade;
    '' close;
}
# Do not record query parameters, Authorization, cookies or request bodies.
log_format hyperline_app_safe '$remote_addr [$time_local] $host $request_method $uri $status $body_bytes_sent';
