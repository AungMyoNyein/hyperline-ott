# Add these server blocks to the EXISTING host Nginx, not inside Docker.
# First configure HTTP and issue certs, then enable SSL using your existing Certbot method.
server { listen 80; server_name ott.zentunnel.net cms.zentunnel.net api.zentunnel.net; location / { proxy_pass http://127.0.0.1:18080; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; } }
# For TLS, use three HTTPS virtual hosts or a SAN certificate, proxying each to 127.0.0.1:18080 with Host preserved.
# If the existing host uses another proxy (Traefik/Caddy), adapt there instead.
