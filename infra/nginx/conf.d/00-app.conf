server { listen 80; server_name ott.zentunnel.net; location / {proxy_pass http://web:3000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;} }
server { listen 80; server_name cms.zentunnel.net; location / {proxy_pass http://cms:3000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;} }
server { listen 80; server_name api.zentunnel.net; root /var/www/html/public; index index.php; location / {try_files $uri $uri/ /index.php?$query_string;} location ~ \.php$ {include fastcgi_params; fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php; fastcgi_param HTTPS on; fastcgi_pass api:9000;} location ~ /\. {deny all;} }
